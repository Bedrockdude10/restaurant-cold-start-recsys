<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Cold-Start RecSys — Ablation Dashboard</title>
<style>
  :root {
    --bg: #FAFAFA; --bg2: #F1F0EC; --txt: #2C2C2A; --txt2: #888780; --txt3: #B4B2A9;
    --bdr: rgba(0,0,0,0.08); --grid: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --bg2: #252524; --txt: #E5E4E0; --txt2: #B4B2A9; --txt3: #73726c;
      --bdr: rgba(255,255,255,0.1); --grid: rgba(255,255,255,0.07);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--txt); line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 0.25rem; }
  h1 span { font-weight: 400; color: var(--txt2); }
  .subtitle { font-size: 14px; color: var(--txt2); margin-bottom: 2rem; }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 2rem; }
  .metric { background: var(--bg2); border-radius: 8px; padding: 1rem; }
  .metric .label { font-size: 13px; color: var(--txt2); margin-bottom: 4px; }
  .metric .value { font-size: 24px; font-weight: 500; }
  .metric .sub { font-size: 12px; color: var(--txt3); margin-top: 4px; }
  .section-label { font-size: 14px; color: var(--txt2); margin: 0 0 0.5rem; }
  .btn-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .btn-row button { background: transparent; border: 1px solid var(--bdr); color: var(--txt); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .btn-row button:hover { background: var(--bg2); }
  .btn-row button.active { font-weight: 600; border-color: var(--txt2); }
  .chart-wrap { position: relative; width: 100%; margin-bottom: 2.5rem; }
  table { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 13px; }
  td.hm { text-align: center; padding: 12px 8px; border-radius: 4px; font-weight: 500; font-variant-numeric: tabular-nums; font-size: 14px; }
  td.hm-empty { text-align: center; padding: 12px 8px; color: var(--txt3); background: var(--bg2); border-radius: 4px; }
  td.row-label { padding: 8px 12px 8px 0; font-weight: 500; color: var(--txt2); font-size: 12px; white-space: nowrap; }
  td.col-label { text-align: center; padding: 8px 4px; font-weight: 500; color: var(--txt2); font-size: 12px; }
  @media (max-width: 640px) { .metrics { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

<h1>Restaurant Cold-Start RecSys <span>ablation dashboard</span></h1>
<p class="subtitle" id="subtitle">CS 7180 &mdash; Two-tower cold start recommendation model</p>

<div id="load-error" style="display:none; background:var(--bg2); border:1px solid var(--bdr); border-radius:8px; padding:1rem 1.25rem; margin-bottom:2rem; font-size:13px; color:var(--txt2);"></div>

<div class="metrics" id="metrics-grid"></div>

<p class="section-label">All experiments &mdash; performance across evaluation splits</p>
<div class="btn-row">
  <button id="btn-hit5" class="active" onclick="setMetric('Hit@5')">Hit@5</button>
  <button id="btn-ndcg10" onclick="setMetric('NDCG@10')">NDCG@10</button>
</div>
<div class="chart-wrap" style="height: 400px;"><canvas id="barChart"></canvas></div>

<p class="section-label">Ablation heatmap &mdash; NDCG@10 by feature combination</p>
<div class="btn-row">
  <button id="btn-warm" onclick="setSplit('warm')">Warm</button>
  <button id="btn-cold_restaurant" class="active" onclick="setSplit('cold_restaurant')">Cold restaurant</button>
  <button id="btn-cold_user" onclick="setSplit('cold_user')">Cold user</button>
</div>
<div id="heatmap" style="margin-bottom: 2.5rem;"></div>

<p class="section-label">Feature contribution &mdash; NDCG@10 delta when each feature group is removed</p>
<div class="chart-wrap" style="height: 340px;"><canvas id="deltaChart"></canvas></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// \u2500\u2500 Theme \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const txtPri = isDark ? '#E5E4E0' : '#2C2C2A';
const txtSec = isDark ? '#B4B2A9' : '#888780';
const gridC = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
const SPLITS = ['warm','cold_restaurant','cold_user'];
const SPLIT_NAME = {warm:'Warm', cold_restaurant:'Cold restaurant', cold_user:'Cold user'};

// \u2500\u2500 Runtime data (populated by loadData) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let R = {};          // name -> { short, label, <split>: { TwoTower/Popularity/Random: {Hit@5,NDCG@10} } }
let ORDER = [];      // experiment names in display order (from summary.csv)
let BASE = {};       // split -> { Random:{...}, Popularity:{...} } (global baselines)
let DNET = null;     // 'dropoutnet' key present in R if the baseline loaded

// \u2500\u2500 Minimal CSV parser (handles quoted fields) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const split = l => {
    const out = []; let cur = '', q = false;
    for (let i=0;i<l.length;i++){ const c=l[i];
      if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"')q=true; else if(c===','){out.push(cur);cur='';} else cur+=c; }
    }
    out.push(cur); return out;
  };
  const header = split(lines[0]);
  return lines.slice(1).map(l => { const cells = split(l); const o={}; header.forEach((h,i)=>o[h]=cells[i]); return o; });
}
const num = v => (v===undefined || v===null || v==='') ? null : parseFloat(v);

// \u2500\u2500 Load everything from the results directory \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
async function loadData() {
  const rows = parseCSV(await (await fetch('./ablation/summary.csv', {cache:'no-store'})).text());
  ORDER = [];
  for (const row of rows) {
    const name = row.experiment;
    if (!name) continue;
    const entry = { short: row.short_label || name, label: row.label || name };
    for (const s of SPLITS) {
      entry[s] = { TwoTower: { 'Hit@5': num(row[`${s}_hit5`]), 'NDCG@10': num(row[`${s}_ndcg10`]) } };
      const rH = num(row[`${s}_random_hit5`]), rN = num(row[`${s}_random_ndcg10`]);
      const pH = num(row[`${s}_popularity_hit5`]), pN = num(row[`${s}_popularity_ndcg10`]);
      if (rH!==null) entry[s].Random = { 'Hit@5': rH, 'NDCG@10': rN };
      if (pH!==null) entry[s].Popularity = { 'Hit@5': pH, 'NDCG@10': pN };
    }
    R[name] = entry;
    // DropoutNet is a baseline, not an ablation: keep it out of ORDER (so it
    // doesn't skew ablation views) but expose it as its own series. summary.csv
    // is the single source \u2014 no separate JSON fetch.
    if (name === 'dropoutnet') { DNET = 'dropoutnet'; } else { ORDER.push(name); }
  }
  // Global baselines: take from the first experiment that carries them (full_model).
  for (const name of ORDER) {
    for (const s of SPLITS) {
      if (!BASE[s] && R[name][s] && R[name][s].Random) {
        BASE[s] = { Random: R[name][s].Random, Popularity: R[name][s].Popularity };
      }
    }
  }
}

// \u2500\u2500 Metric cards (computed from the loaded data) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function mc(label, val, sub, accent) {
  return `<div class="metric"><div class="label">${label}</div><div class="value" style="color:${accent}">${val}</div><div class="sub">${sub}</div></div>`;
}
function bestBy(split, metric) { // best two-tower ablation (excludes dropoutnet)
  let best=null;
  for (const n of ORDER) { const v=R[n][split].TwoTower[metric]; if(v!=null && (!best || v>best.v)) best={n,v}; }
  return best;
}
function renderCards() {
  const mg = document.getElementById('metrics-grid');
  const w = bestBy('warm','NDCG@10');
  const cr = bestBy('cold_restaurant','Hit@5');
  const cu = bestBy('cold_user','NDCG@10');
  const cards = [];
  if (w) cards.push(mc('Best warm NDCG@10', (w.v*100).toFixed(1)+'%', R[w.n].short, '#378ADD'));
  if (cr) {
    const rand = BASE.cold_restaurant?.Random?.['Hit@5'];
    const dn = DNET ? R.dropoutnet.cold_restaurant.TwoTower['Hit@5'] : null;
    let sub = R[cr.n].short;
    if (rand) sub += ` \u2014 ${(cr.v/rand).toFixed(1)}\u00d7 random`;
    if (dn!=null) sub += ` \u00b7 DropoutNet ${(dn*100).toFixed(1)}%`;
    cards.push(mc('Best cold-restaurant Hit@5', (cr.v*100).toFixed(1)+'%', sub, '#D85A30'));
  }
  if (cu) {
    const pop = BASE.cold_user?.Popularity?.['NDCG@10'];
    let sub = R[cu.n].short;
    if (pop) sub += ` \u2014 ${(((cu.v-pop)/pop)*100).toFixed(0)}% vs popularity`;
    cards.push(mc('Best cold-user NDCG@10', (cu.v*100).toFixed(1)+'%', sub, '#1D9E75'));
  }
  mg.innerHTML = cards.join('');
}

// \u2500\u2500 Bar chart (all experiments + DropoutNet) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let curMetric = 'Hit@5', barChart = null;
function setMetric(m) {
  curMetric = m;
  document.querySelectorAll('.btn-row button').forEach(b => {if(b.id.startsWith('btn-hit')||b.id.startsWith('btn-ndcg')) b.classList.remove('active')});
  document.getElementById(m === 'Hit@5' ? 'btn-hit5' : 'btn-ndcg10').classList.add('active');
  drawBar();
}
function drawBar() {
  const m = curMetric;
  const names = DNET ? [...ORDER, DNET] : [...ORDER];
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels: names.map(n=>R[n].short), datasets: [
      { label: 'Warm', data: names.map(n=>R[n].warm.TwoTower[m]), backgroundColor: '#85B7EB', borderColor: '#378ADD', borderWidth: 1 },
      { label: 'Cold restaurant', data: names.map(n=>R[n].cold_restaurant.TwoTower[m]), backgroundColor: '#F0997B', borderColor: '#D85A30', borderWidth: 1 },
      { label: 'Cold user', data: names.map(n=>R[n].cold_user.TwoTower[m]), backgroundColor: '#5DCAA5', borderColor: '#1D9E75', borderWidth: 1 }
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { color: txtPri, font: {size:12}, boxWidth: 12, padding: 16 }}, tooltip: { callbacks: { label: c=>c.dataset.label+': '+(c.raw*100).toFixed(1)+'%' }}},
      scales: { x: { ticks: { color: txtSec, font: {size:10}, maxRotation: 45, autoSkip: false }, grid: {display:false} }, y: { ticks: { color: txtSec, callback: v=>(v*100).toFixed(0)+'%' }, grid: {color: gridC}, beginAtZero: true }}}
  });
}

// \u2500\u2500 Heatmap (content \u00d7 context matrix) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let curSplit = 'cold_restaurant';
function setSplit(s) {
  curSplit = s;
  ['warm','cold_restaurant','cold_user'].forEach(k => { const b=document.getElementById('btn-'+k); b.classList.toggle('active', k===s); });
  drawHeatmap();
}
function cellVal(name, s) { return (R[name] && R[name][s]) ? R[name][s].TwoTower['NDCG@10'] : null; }
function drawHeatmap() {
  const s = curSplit;
  const rows = [
    { label: 'User: all features', cells: ['full_model','no_temporal','no_restaurant_content'] },
    { label: 'User: content only', cells: ['no_user_context','content_x_content',null] },
    { label: 'User: context only', cells: ['no_user_content',null,'context_x_context'] }
  ];
  const colLabels = ['Rest: all','Rest: content only','Rest: context only'];
  let vals = [];
  rows.forEach(r => r.cells.forEach(c => { const v=c?cellVal(c,s):null; if(v!=null) vals.push(v); }));
  const mn = Math.min(...vals), mx = Math.max(...vals);
  function lerp(a,b,t){return Math.round(a+(b-a)*t)}
  function bg(v){ let t=mx>mn?(v-mn)/(mx-mn):0.5; if(isDark)return `rgb(${lerp(60,30,t)},${lerp(35,90,t)},${lerp(55,60,t)})`; return `rgb(${lerp(230,100,t)},${lerp(100,190,t)},${lerp(100,120,t)})`; }
  function fg(v){ let t=mx>mn?(v-mn)/(mx-mn):0.5; return (isDark||t>0.45)?'#fff':'#1a1a1a'; }
  let h = '<table><tr><td></td>'+colLabels.map(l=>`<td class="col-label">${l}</td>`).join('')+'</tr>';
  rows.forEach(r => { h += `<tr><td class="row-label">${r.label}</td>`; r.cells.forEach(c => { const v=c?cellVal(c,s):null; if(v==null){h+='<td class="hm-empty">\u2014</td>';} else { h+=`<td class="hm" style="background:${bg(v)};color:${fg(v)}">${(v*100).toFixed(2)}%</td>`; }}); h+='</tr>'; });
  h += '</table>';
  document.getElementById('heatmap').innerHTML = h;
}

// \u2500\u2500 Delta chart (ablation vs full model) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let deltaChart = null;
function drawDelta() {
  if (!R.full_model) return;
  const base = R.full_model;
  const candidates = [['User context (DoW + dist)','no_user_context'],['User content (prefs + onb)','no_user_content'],['Restaurant temporal','no_temporal'],['Restaurant content','no_restaurant_content'],['Onboarding signal','no_onboarding'],['Preference signal','no_preferences']];
  const ablations = candidates.filter(([,k]) => R[k]);
  const colors = {warm:'#378ADD',cold_restaurant:'#D85A30',cold_user:'#1D9E75'};
  const datasets = SPLITS.map(s => ({ label: SPLIT_NAME[s], data: ablations.map(([,k])=>parseFloat(((R[k][s].TwoTower['NDCG@10']-base[s].TwoTower['NDCG@10'])*100).toFixed(2))), backgroundColor: colors[s]+'99', borderColor: colors[s], borderWidth: 1 }));
  if(deltaChart) deltaChart.destroy();
  deltaChart = new Chart(document.getElementById('deltaChart'), {
    type: 'bar', data: { labels: ablations.map(a=>a[0]), datasets },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { color: txtPri, font: {size:12}, boxWidth: 12, padding: 16 }}, tooltip: { callbacks: { label: c=>c.dataset.label+': '+(c.raw>0?'+':'')+c.raw.toFixed(2)+' pp' }}},
      scales: { x: { ticks: { color: txtSec, callback: v=>(v>0?'+':'')+v.toFixed(1)+' pp' }, grid: {color:gridC}, title: {display:true, text:'NDCG@10 change (percentage points)', color:txtSec, font:{size:11}}}, y: { ticks: {color:txtSec, font:{size:11}}, grid:{display:false} }}}
  });
}

// \u2500\u2500 Boot \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
(async function () {
  try {
    await loadData();
    const n = ORDER.length;
    document.getElementById('subtitle').textContent =
      `CS 7180 \u2014 Two-tower cold start recommendation model \u2014 ${n} experiments`
      + (DNET ? ' + DropoutNet baseline' : '') + ' across 3 evaluation splits';
    renderCards();
    drawBar(); drawHeatmap(); drawDelta();
  } catch (e) {
    const box = document.getElementById('load-error');
    box.style.display = 'block';
    box.innerHTML = '<strong>Could not load results.</strong> This dashboard reads '
      + '<code>ablation/summary.csv</code> and <code>dropoutnet_results.json</code> at runtime, '
      + 'which browsers block over <code>file://</code>. Serve this folder over HTTP instead:'
      + '<br><br><code>cd results &amp;&amp; python -m http.server 8000</code><br>'
      + 'then open <code>http://localhost:8000/dashboard.html</code>.'
      + '<br><br><span style="color:var(--txt3)">Details: ' + (e && e.message ? e.message : e) + '</span>';
    console.error(e);
  }
})();
</script>
</body>
</html>
